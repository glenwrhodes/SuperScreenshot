ShortDescription: Snipping Tool, with vertical scrolling. Drag past the bottom of the screen and the page scrolls with you.
Description: |-
  SuperScreenshot works like Snipping Tool: press Win+Shift+X, drag a box, and the screenshot is copied to the clipboard.
  The difference is that it scrolls. Drag into the bottom (or top) edge of a window and the page scrolls under your selection, or turn the mouse wheel while holding the button. When you let go you get one seamless, full-resolution image of the whole thing.
  It runs in the notification area, starts with Windows, and never uses the network.
