name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach the downloads to releases

jobs:
  windows:
    name: Build, test and package (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = ([xml](Get-Content src/SuperScreenshot/SuperScreenshot.csproj)).Project.PropertyGroup.Version | ? { $_ } | Select -First 1 }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Building SuperScreenshot $v"

      - name: Test, publish, build the installer and test it
        shell: pwsh
        run: ./publish.ps1 -Version ${{ steps.version.outputs.version }} -TestInstaller

      - name: Package the portable exe
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md dist/
          Compress-Archive -Path dist/SuperScreenshot.exe, dist/LICENSE, dist/README.md -DestinationPath SuperScreenshot-${{ steps.version.outputs.version }}-portable-x64.zip

      - name: Upload installer log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log
          path: dist/installer/install.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: SuperScreenshot-Setup-x64
          path: dist/installer/SuperScreenshot-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SuperScreenshot-portable-x64
          path: SuperScreenshot-*-portable-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "SuperScreenshot $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/installer/SuperScreenshot-Setup-*.exe SuperScreenshot-*-portable-x64.zip --clobber
